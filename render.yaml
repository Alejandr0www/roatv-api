services:
  - type: web
    name: roatv-api
    runtime: docker
    plan: free
    rootDir: roa_tv_api
    healthCheckPath: /api/health
    envVars:
      - key: TMDB_TOKEN
        sync: false
      - key: ADDON_LATAM_MANIFEST_URL
        sync: false
      - key: TORRENTIO_MANIFEST_URL
        sync: false
      - key: AIOSTREAMS_MANIFEST_URL
        sync: false
      - key: ENABLE_SQL
        value: "false"
      - key: CORS_ORIGINS
        value: http://localhost:5000,http://127.0.0.1:5000,https://roatv-web.onrender.com

